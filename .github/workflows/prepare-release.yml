name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type (patch, minor, major)"
        required: false
        default: "patch"
      prerelease:
        description: "Publish as prerelease? (leave empty for stable, or enter tag like 'next')"
        required: false
        default: ""

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Lint & Type Check
        run: bun run check

      - name: Build bundle
        run: bun run build

      - name: Update-chain preflight smoke
        run: bun run test:update-chain:manual

  prepare:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          VERSION_TYPE="${{ github.event.inputs.version_type || 'patch' }}"
          PRERELEASE_TAG="${{ github.event.inputs.prerelease }}"
          OLD_VERSION=$(jq -r '.version' package.json)

          if [[ "$OLD_VERSION" == *-* ]]; then
            OLD_IS_PRERELEASE=true
            BASE_VERSION=$(echo "$OLD_VERSION" | sed 's/-.*//')
          else
            OLD_IS_PRERELEASE=false
            BASE_VERSION="$OLD_VERSION"
          fi

          IFS='.' read -ra VERSION_PARTS <<< "$BASE_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          if [ "$VERSION_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$VERSION_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            if [ "$OLD_IS_PRERELEASE" = "false" ]; then
              PATCH=$((PATCH + 1))
            fi
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          if [ -n "$PRERELEASE_TAG" ]; then
            if [[ "$OLD_VERSION" == "${NEW_VERSION}-${PRERELEASE_TAG}."* ]]; then
              PRERELEASE_NUM=$(echo "$OLD_VERSION" | sed "s/${NEW_VERSION}-${PRERELEASE_TAG}\.\([0-9]*\)/\1/")
              PRERELEASE_NUM=$((PRERELEASE_NUM + 1))
            else
              PRERELEASE_NUM=1
            fi
            NEW_VERSION="${NEW_VERSION}-${PRERELEASE_TAG}.${PRERELEASE_NUM}"
          fi

          jq --arg version "$NEW_VERSION" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git add package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"

      - name: Create version bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/bump-v${{ steps.version.outputs.new_version }}"
          VERSION="${{ steps.version.outputs.new_version }}"

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$BRANCH"
            REMOTE_VERSION=$(git show FETCH_HEAD:package.json | jq -r '.version')
            if [ "$REMOTE_VERSION" != "$VERSION" ]; then
              echo "Remote branch $BRANCH contains version $REMOTE_VERSION, expected $VERSION."
              exit 1
            fi
            echo "Reusing existing remote branch $BRANCH."
          else
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
          fi

          for ATTEMPT in 1 2 3 4 5; do
            PR_URL=$(gh api \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:$BRANCH" \
              --jq '.[0].html_url // empty' || true)
            if [ -n "$PR_URL" ]; then
              echo "Release PR already exists: $PR_URL"
              exit 0
            fi

            if PR_URL=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
              --raw-field title="chore: bump version to $VERSION" \
              --raw-field body="Merge this PR to publish v$VERSION." \
              --raw-field base="main" \
              --raw-field head="$BRANCH" \
              --jq '.html_url'); then
              echo "$PR_URL"
              exit 0
            fi

            if [ "$ATTEMPT" -eq 5 ]; then
              echo "Failed to create the release PR after $ATTEMPT attempts."
              exit 1
            fi

            sleep $((ATTEMPT * 5))
          done
