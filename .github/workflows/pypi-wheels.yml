name: Build and test Python wheels

# Artifact-only workflow: publishing requires a separately approved release.
on:
  pull_request:
    paths:
      - python/**
      - scripts/*pypi*
      - src/**
      - build.js
      - package.json
      - bun.lock
      - .github/workflows/pypi-wheels.yml
  push:
    branches: [main]
    paths:
      - python/**
      - scripts/*pypi*
      - src/**
      - build.js
      - package.json
      - bun.lock
      - .github/workflows/pypi-wheels.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: /opt/python/cp311-cp311/bin/python
            platform: manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: /opt/python/cp311-cp311/bin/python
            platform: manylinux_2_28_aarch64
          - runner: macos-15-intel
            python: python
            platform: macosx_14_0_x86_64
          - runner: macos-15
            python: python
            platform: macosx_14_0_arm64
          - runner: windows-2022
            python: python
            platform: win_amd64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        if: runner.os != 'Linux'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Build native wheel
        run: ${{ matrix.python }} scripts/build-pypi.py
      - name: Check Linux ABI and vendor non-policy shared libraries
        if: runner.os == 'Linux'
        run: |
          ${{ matrix.python }} -m pip install auditwheel==6.6.0
          ${{ matrix.python }} -m auditwheel show python/dist/*.whl
          ${{ matrix.python }} -m auditwheel repair --plat ${{ matrix.platform }} --only-plat -w python/repaired python/dist/*.whl
          rm python/dist/*.whl
          mv python/repaired/*.whl python/dist/
      - name: Check macOS architectures and vendor external dylibs
        if: runner.os == 'macOS'
        run: |
          ${{ matrix.python }} -m pip install delocate==0.12.0
          delocate-wheel --require-archs "$(uname -m)" -w python/repaired python/dist/*.whl
          rm python/dist/*.whl
          mv python/repaired/*.whl python/dist/
      - name: Validate metadata
        run: |
          ${{ matrix.python }} -m pip install twine==6.2.0
          ${{ matrix.python }} -m twine check --strict python/dist/*.whl
      - name: Test installed wheel without system Node or npm
        run: ${{ matrix.python }} scripts/smoke-pypi.py python/dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: letta-wheel-${{ matrix.platform }}
          path: python/dist/*.whl
          if-no-files-found: error
