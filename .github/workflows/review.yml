name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review, including an approved external PR"
        required: true
        type: number

jobs:
  review:
    # Fork pull_request runs do not receive the Amelia secrets even after a
    # maintainer approves the Actions run. Use workflow_dispatch to explicitly
    # review an external PR after approval.
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.pull_request.draft == false &&
       github.actor != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: React with eyes (review starting)
        id: eyes_reaction
        run: |
          # Clear any existing rocket from a previous LGTM run on this PR
          EXISTING_ROCKET=$(gh api repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/reactions \
            --jq '.[] | select(.content == "rocket" and .user.login == "amelia-letta") | .id' | head -1)
          if [ -n "$EXISTING_ROCKET" ]; then
            echo "Clearing previous rocket reaction: $EXISTING_ROCKET"
            gh api repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/reactions/$EXISTING_ROCKET -X DELETE || true
          fi
          # Add eyes to signal review in progress
          REACTION_ID=$(gh api repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/reactions \
            -X POST -f content="eyes" --jq '.id')
          echo "Eyes reaction ID: $REACTION_ID"
          echo "reaction_id=$REACTION_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.AMELIA_GITHUB_TOKEN }}

      - uses: letta-ai/letta-code-action@244cc9e80c77cfebdb3ec8e146e018a5fe0af027
        id: letta_review
        env:
          AMELIA_GITHUB_TOKEN: ${{ secrets.AMELIA_GITHUB_TOKEN }}
        with:
          letta_api_key: ${{ secrets.AMELIA_LETTA_API_KEY }}
          github_token: ${{ secrets.AMELIA_GITHUB_TOKEN }}
          agent_id: agent-cd664b86-4d28-49b7-8ad6-60677eaff9be
          # Review the CI checkout. Existing Cloud delivery rejects local
          # execution options such as the action's --yolo and model flags.
          letta_args: --new
          track_progress: ""
          tracking_comment: "false"
          model: letta/auto
          prompt: |
            You are reviewing PR #${{ env.PR_NUMBER }} in ${{ github.repository }}.

            ## GitHub authentication

            Before any `gh` command, run:

            ```bash
            export GH_TOKEN="$AMELIA_GITHUB_TOKEN"
            export GITHUB_REPOSITORY="${{ github.repository }}"
            export PR_NUMBER="${{ env.PR_NUMBER }}"
            ```

            Use `AMELIA_GITHUB_TOKEN` for every GitHub operation. Never use `CAREN_GITHUB_TOKEN`. Review runs on the CI runner; use its checkout for source inspection.

            ## Your job

            1. Read your `reference/review-knowledge.md` memory file for the current review sources and automated-review instructions
            2. Run `gh pr view $PR_NUMBER --repo "$GITHUB_REPOSITORY" --json title,body,comments` to get the PR title, description, and comments
            3. Resolve any previously addressed comments — see "Resolving addressed comments" below
            4. Run `gh pr diff $PR_NUMBER --repo "$GITHUB_REPOSITORY"` to read the full diff
            5. Judge scope first (see "Scope check"), then assess whether the PR introduces real risk
            6. If nothing to flag, respond with exactly: `LGTM`
            7. If something to flag, leave inline review comments, then respond with exactly: `Left comments`

            **Default posture: signal-only.** Most PRs are fine. Only speak when there's something worth saying.

            **Focus on the diff.** Only read additional files if the changed code is ambiguous without surrounding context. Don't re-read entire files you already know.

            ## Scope check

            **Past roughly 1k changed lines**, step back before any line-level review and ask two things: should this be split, and does it belong in core at all? Opt-in or niche behavior wired into shared core paths (channel gateway, turn/tool/approval orchestration) could probably live in a mod, plugin, or custom channel instead — and with the opt-in off, does default behavior for every host stay exactly identical, and is it actually gated? If the answer looks wrong, say so as a short note at the top of the review body. That's it — not an auto-reject, not blocking on its own.

            **Escalate to the full danger-zone flag** when it's thousands of lines, or when it touches dangerous ground with no clear code owner driving it:

            - New or changed listener/app-server protocol commands or fields — that's modifying our API, not just adding code.
            - Queueing or turn-batching behavior — extremely bug-prone when the author doesn't fully understand it.
            - New core concepts slipped in through prose. If a PR description or comment casually asserts something like "each input selects its own immutable `scope_id` registration through the existing `external_tool_scope_ids` field", stop and say so: `@cpacker this doesn't seem right, can you confirm we want changes like this?`

            There, lead the review body with the verdict: danger zone / scope creep, don't merge as-is, split it or move it out of core where that applies. Tag @cpacker — he owns channels, the listener, queueing, and the protocol — for explicit confirmation, and treat it as unresolved until he confirms. Post it with `event="REQUEST_CHANGES"` — never approve — then respond `Left comments`. Skip the detailed inline review unless there's a severe bug worth calling out.

            Small, well-scoped PRs, or ones clearly driven by the owner, get neither. Default posture stays signal-only.

            ## What to flag

            - Bugs, logic errors, security issues (injection, auth bypass, secrets exposure)
            - Race conditions, missing error handling, state cleanup gaps
            - New state in App.tsx or approval components (flicker risk — see review-knowledge.md)
            - Redundant blocking API calls, performance footguns
            - Shell tool parity gaps, streaming code assuming one provider's behavior
            - RED ZONE: PRs duplicating pi-ai's provider runtime in LC (image stripping, capability checks like `model.input.includes("image")`, provider format fixups past the toPiMessage boundary) — pi-ai owns this domain, require root cause artifact + upstream check before approving. See review-knowledge.md for the full checklist

            ## What NOT to flag

            - Style, naming, formatting — Biome handles this
            - Things that are correct but you'd do differently
            - Existing patterns followed consistently (even if suboptimal)
            - Known flaky test failures (see review-knowledge.md for the list)

            ## Voice

            You're Amelia. Be yourself — casual, direct, no filler. If you flag something, say it the way you'd say it to Caren in conversation: tight, concrete, no padding. Don't sound like a bot or a linter. You're a collaborator pointing something out, not a bureaucrat filing a report.

            ## How to comment

            Use `gh api` to create a PR review with inline comments on specific lines:

            ```bash
            gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews \
              -X POST \
              -f event="COMMENT" \
              -f body="" \
              -f 'comments[][path]=<file>' \
              -f 'comments[][line]=<line-number>' \
              -f 'comments[][body]=<your comment>'
            ```

            **1-2 short sentences max.** State the concrete risk, nothing else. No explanations, no context, no suggestions unless asked. Examples:
            - ✅ `track_progress` will crash on `workflow_dispatch` — the action rejects it for non-PR events.
            - ✅ `show_full_output: "true"` leaks tool output (potentially secrets) into CI logs.
            - ❌ The `track_progress` option is set to "true" in this workflow, but the letta-code-action's `validateTrackProgressEvent` function explicitly rejects the `workflow_dispatch` event type when track_progress is enabled. This means every manual dispatch will throw an error. You should either remove track_progress and handle tracking yourself in the prompt, or split into two jobs — one for pull_request (with track_progress) and one for workflow_dispatch (without it).

            ## Suggested patches

            For high-confidence, surgical fixes (wrong operator, wrong fallback value, missing guard, clear typo), include a suggested patch directly in the comment body using GitHub's suggestion syntax. The author can apply it in one click.

            **When to use suggestions:** The fix is unambiguous, confined to the flagged lines, and you are certain it is correct. Do NOT suggest if the fix requires broader context, multiple files, or architectural judgment.

            **Before writing a suggestion:** Read the current file content at the flagged path to get the exact lines. The suggestion block must contain the complete replacement for the covered lines — GitHub diffs it against the original automatically.

            **Single-line suggestion:**
            ```bash
            gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews \
              -X POST \
              -f event="COMMENT" \
              -f body="" \
              -f 'comments[][path]=<file>' \
              -f 'comments[][line]=<line-number>' \
              -f 'comments[][body]=<one sentence stating the risk>

            ```suggestion
            <replacement line>
            ```'
            ```

            **Multi-line suggestion** (add `start_line` to cover a range):
            ```bash
            gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews \
              -X POST \
              -f event="COMMENT" \
              -f body="" \
              -f 'comments[][path]=<file>' \
              -f 'comments[][start_line]=<first-line>' \
              -f 'comments[][line]=<last-line>' \
              -f 'comments[][body]=<one sentence stating the risk>

            ```suggestion
            <replacement lines>
            ```'
            ```

            Example — wrong operator on a single line:
            ```
            `&&` should be `||` — requires both vars set, breaking `LETTA_DEBUG=1` alone.

            ```suggestion
              return lettaDebug === "1" || lettaDebug === "true" || legacyDebug === "1" || legacyDebug === "true";
            ```
            ```

            ## Resolving addressed comments

            Before reviewing the new diff, check if any of your previous review comments have been addressed. If they have, resolve the thread so the author doesn't have to.

            1. Fetch unresolved review threads you left:
               ```bash
               OWNER=$(echo $GITHUB_REPOSITORY | cut -d/ -f1)
               REPO=$(echo $GITHUB_REPOSITORY | cut -d/ -f2)
               gh api graphql -f query="{ repository(owner: \"$OWNER\", name: \"$REPO\") { pullRequest(number: $PR_NUMBER) { reviewThreads(first: 50) { nodes { id isResolved comments(first: 1) { nodes { author { login } databaseId body path line } } } } } } }" --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false) | select(.comments.nodes[0].author.login == "amelia-letta") | {threadId: .id, commentId: .comments.nodes[0].databaseId, body: .comments.nodes[0].body[0:120], path: .comments.nodes[0].path, line: .comments.nodes[0].line}'
               ```
            2. For each unresolved thread, check the current code at that path/line. If the issue has been clearly addressed, resolve it:
               ```bash
               gh api graphql -f query='mutation { resolveReviewThread(input: {threadId: "THREAD_ID"}) { thread { isResolved } } }'
               ```
            3. Only resolve threads where you are the author. Only resolve when the fix clearly addresses your original comment.

          followup_prompt: |
            Re-review PR #${{ env.PR_NUMBER }} in ${{ github.repository }} after its latest update.

            Before any `gh` command, export `GH_TOKEN="$AMELIA_GITHUB_TOKEN"`, `GITHUB_REPOSITORY="${{ github.repository }}"`, and `PR_NUMBER="${{ env.PR_NUMBER }}"`. Never use `CAREN_GITHUB_TOKEN`.

            Use the review process, risk criteria, voice, and inline-comment instructions established earlier in this conversation.

            1. Fetch the current PR title, body, comments, and diff.
            2. Resolve any of your previous review threads that the latest changes clearly addressed.
            3. Review the latest diff with the same signal-only posture, focusing on real risk introduced by the current changes.
            4. Do not repeat unresolved findings unless the latest changes introduce a distinct risk.
            5. If nothing to flag, respond with exactly: `LGTM`
            6. If you leave inline review comments, respond with exactly: `Left comments`

      - name: React based on review outcome
        if: steps.letta_review.outputs.execution_file != ''
        run: |
          # Parse the agent's final response from the execution file before the
          # expert review action reuses the action's shared output path.
          RESULT=$(cat "${{ steps.letta_review.outputs.execution_file }}" \
            | jq -r '[.[] | select(.type == "result") | .result] | last // ""')
          echo "Review result: $RESULT"

          if echo "$RESULT" | grep -qi "LGTM"; then
            # LGTM — delete eyes, add rocket
            if [ -n "${{ steps.eyes_reaction.outputs.reaction_id }}" ]; then
              gh api repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/reactions/${{ steps.eyes_reaction.outputs.reaction_id }} \
                -X DELETE || true
            fi
            gh api repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/reactions \
              -X POST -f content="rocket"
          else
            # Comments left — keep eyes, no rocket
            echo "Comments left — keeping eyes reaction"
          fi
        env:
          GH_TOKEN: ${{ secrets.AMELIA_GITHUB_TOKEN }}

      - name: Load expert review prompt
        id: expert_review_prompt
        if: steps.letta_review.outcome == 'success'
        run: |
          {
            echo 'value<<EXPERT_REVIEW_PROMPT'
            cat .github/agent-prompts/expert-review.md
            echo 'EXPERT_REVIEW_PROMPT'
          } >> "$GITHUB_OUTPUT"

      - uses: letta-ai/letta-code-action@b7e51edb0643e67ae74327a1cdf0c332e549f8fc
        id: expert_review
        if: steps.expert_review_prompt.outputs.value != ''
        continue-on-error: true
        env:
          AMELIA_GITHUB_TOKEN: ${{ secrets.AMELIA_GITHUB_TOKEN }}
        with:
          letta_api_key: ${{ secrets.AMELIA_LETTA_API_KEY }}
          github_token: ${{ secrets.AMELIA_GITHUB_TOKEN }}
          agent_id: agent-cd664b86-4d28-49b7-8ad6-60677eaff9be
          letta_args: --new
          track_progress: ""
          tracking_comment: "false"
          model: letta/auto
          prompt: ${{ steps.expert_review_prompt.outputs.value }}

      - name: Report expert review outcome
        if: always() && steps.expert_review.outputs.execution_file != ''
        run: |
          RESULT=$(cat "${{ steps.expert_review.outputs.execution_file }}" \
            | jq -r '[.[] | select(.type == "result") | .result] | last // ""')
          echo "Expert review result: $RESULT"

  # Charles asked for a loud flag when a letta-code PR edits the system prompt:
  # agents default to the backend prompt now, so the letta-cloud copy must be
  # kept in sync. The review job runs on the CI runner, which has no Slack
  # channel, so this asks Amelia's Cloud harness to post through its existing
  # Slack connection, once per PR.
  system-prompt-drift-flag:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.pull_request.draft == false &&
       github.actor != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: system-prompt-drift-flag-${{ github.event.inputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
      PROMPT_PATHS: '^src/agent/prompts/letta[^/]*\.md$'
      CLOUD_PROMPT_DIR: libs/service-core-runtime/src/lib/core-runtime/systemPrompt/prompts/
      MARKER: "<!-- system-prompt-drift-flag -->"
    steps:
      - name: Check for system prompt edits
        id: check
        env:
          GH_TOKEN: ${{ secrets.AMELIA_GITHUB_TOKEN }}
          AUTHOR_SLACK_IDS: ${{ vars.SYNC_TOOLS_SOURCE_AUTHOR_SLACK_IDS }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[].filename' | grep -E "$PROMPT_PATHS" || true)
          if [ -z "$files" ]; then
            echo "No system prompt edits"
            exit 0
          fi
          flagged=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.user.login == \"amelia-letta\" and (.body | contains(\"$MARKER\")))] | length" \
            | awk '{ n += $1 } END { print n + 0 }')
          if [ "$flagged" -gt 0 ]; then
            echo "Already flagged"
            exit 0
          fi
          names=$(awk -F/ '{ printf "%s%s", sep, $NF; sep = ", " }' <<< "$files")
          pr_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR_NUMBER"
          author=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.user.login')
          slack_ids=${AUTHOR_SLACK_IDS:-}
          [ -n "$slack_ids" ] || slack_ids='{}'
          mention=$(jq -r --arg a "$author" '.[$a] // empty' <<< "$slack_ids" 2>/dev/null || true)
          message="${mention:+<@$mention> }:rotating_light: $pr_url edits the letta-code system prompt ($names). Agents default to the backend prompt now, so letta-cloud's copy in $CLOUD_PROMPT_DIR needs the same change or they drift."
          {
            echo "needed=true"
            echo "names=$names"
            echo "prompt<<DRIFT_FLAG_PROMPT"
            echo "Call the native \`MessageChannel\` tool once with \`action=\"send\"\`, \`channel=\"slack\"\`, \`target=\"C0871ER46KT\"\`, and exactly this text:"
            echo
            echo "$message"
            echo
            echo "Do not use curl or another Slack client, read anything, or change GitHub. After the send succeeds, respond with exactly \`SENT\`. If it fails, respond with the error."
            echo "DRIFT_FLAG_PROMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Ask Amelia to post the flag
        id: amelia
        if: steps.check.outputs.needed == 'true'
        uses: letta-ai/letta-code-action@b7e51edb0643e67ae74327a1cdf0c332e549f8fc
        with:
          letta_api_key: ${{ secrets.AMELIA_LETTA_API_KEY }}
          github_token: ${{ secrets.AMELIA_GITHUB_TOKEN }}
          agent_id: agent-cd664b86-4d28-49b7-8ad6-60677eaff9be
          environment: cloud
          letta_args: --new
          track_progress: ""
          tracking_comment: "false"
          model: letta/auto
          prompt: ${{ steps.check.outputs.prompt }}

      - name: Record the flag on the PR
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AMELIA_GITHUB_TOKEN }}
          EXECUTION_FILE: ${{ steps.amelia.outputs.execution_file }}
          NAMES: ${{ steps.check.outputs.names }}
        run: |
          set -euo pipefail
          result=$(jq -r '[.[] | select(.type == "result" and (.result | type) == "string")] | last | (.result // "" | split("\n") | map(gsub("^\\s+|\\s+$"; "") | select(length > 0)) | last // "")' "$EXECUTION_FILE")
          if [ "$result" != "SENT" ]; then
            echo "Slack flag not sent: $result" >&2
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$MARKER
          Heads up: this PR edits the letta-code system prompt ($NAMES). Agents default to the backend prompt now, so the letta-cloud copy in \`$CLOUD_PROMPT_DIR\` needs the same change. Flagged in Slack."
