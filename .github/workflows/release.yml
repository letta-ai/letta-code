name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - package.json

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      pypi_published: ${{ steps.version.outputs.pypi_published }}
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect release bump commit
        id: detect
        run: |
          set -euo pipefail

          SUBJECT=$(git log --format=%s "${{ github.event.before }}..${{ github.sha }}" | grep -E '^chore: bump version to ' | tail -n 1 || true)
          if [ -z "$SUBJECT" ]; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_publish=true" >> $GITHUB_OUTPUT
          echo "subject=$SUBJECT" >> $GITHUB_OUTPUT

      - name: Setup Bun
        if: steps.detect.outputs.should_publish == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node (bundled npm 11 for OIDC publishing)
        if: steps.detect.outputs.should_publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          registry-url: "https://registry.npmjs.org"

      - name: Derive release metadata
        if: steps.detect.outputs.should_publish == 'true'
        id: version
        run: |
          set -euo pipefail

          git fetch --tags origin

          VERSION=$(jq -r '.version' package.json)
          PACKAGE_NAME=$(jq -r '.name' package.json)
          TAG="v$VERSION"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_LABEL=$(echo "$VERSION" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-([^.]+)(\..*)?$/\1/')
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "npm_tag=$PRERELEASE_LABEL" >> $GITHUB_OUTPUT
            echo "previous_tag=" >> $GITHUB_OUTPUT
          else
            PREVIOUS_TAG=$(
              curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ github.token }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
                | jq -r --arg tag "$TAG" '
                    map(select(.draft == false and .prerelease == false and .tag_name != $tag))
                    | sort_by(.published_at // .created_at)
                    | last
                    | .tag_name // empty
                  ' || true
            )

            if [ -z "$PREVIOUS_TAG" ]; then
              PREVIOUS_TAG=$(
                git tag --sort=-version:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                  | grep -Fxv "$TAG" \
                  | head -n 1 || true
              )
            fi

            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
            echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "npm_published=true" >> $GITHUB_OUTPUT
          else
            echo "npm_published=false" >> $GITHUB_OUTPUT
          fi

          if curl -fsSL "https://pypi.org/pypi/letta/$VERSION/json" >/dev/null 2>&1; then
            echo "pypi_published=true" >> $GITHUB_OUTPUT
          else
            echo "pypi_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.detect.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Lint & Type Check
        if: steps.detect.outputs.should_publish == 'true'
        run: bun run check

      - name: Build bundle
        if: steps.detect.outputs.should_publish == 'true'
        run: bun run build

      - name: Smoke test - help
        if: steps.detect.outputs.should_publish == 'true'
        run: ./letta.js --help

      - name: Smoke test - version
        if: steps.detect.outputs.should_publish == 'true'
        run: ./letta.js --version || echo "Version flag not implemented yet"

      - name: Integration smoke test (real API)
        if: steps.detect.outputs.should_publish == 'true'
        env:
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
        run: ./letta.js --prompt "ping" --tools "" --permission-mode standard

      - name: Create release tag on merged main commit
        if: steps.detect.outputs.should_publish == 'true' && steps.version.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA" >/dev/null

      - name: Verify release tag before publishing packages
        if: steps.detect.outputs.should_publish == 'true'
        env:
          TARGET_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_COMMIT=$(
            git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$TARGET_TAG^{}" \
              | awk 'NR == 1 { print $1 }'
          )
          if [ -z "$TAG_COMMIT" ]; then
            TAG_COMMIT=$(
              git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$TARGET_TAG" \
                | awk 'NR == 1 { print $1 }'
            )
          fi
          test "$TAG_COMMIT" = "$GITHUB_SHA"

      - name: Publish to npm
        if: steps.detect.outputs.should_publish == 'true' && steps.version.outputs.npm_published != 'true'
        run: npm publish --access public --tag ${{ steps.version.outputs.npm_tag }}

      - name: Wait for the published package
        if: steps.detect.outputs.should_publish == 'true'
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for _ in {1..90}; do
            if OUTPUT=$(npm view "$PACKAGE_NAME@$VERSION" version 2>&1); then
              exit 0
            fi
            sleep 10
          done
          echo "Package $PACKAGE_NAME@$VERSION did not become available within fifteen minutes."
          printf '%s\n' "$OUTPUT"
          exit 1

      - name: Set up QEMU
        if: steps.detect.outputs.should_publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.detect.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.detect.outputs.should_publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.detect.outputs.should_publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set container image tags
        if: steps.detect.outputs.should_publish == 'true'
        id: container
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            letta/letta
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_prerelease == 'false' }}

      - name: Build and publish container image
        if: steps.detect.outputs.should_publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            LETTA_CODE_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.container.outputs.tags }}
          labels: ${{ steps.container.outputs.labels }}

      - name: Create draft GitHub Release
        if: steps.detect.outputs.should_publish == 'true' && steps.version.outputs.is_prerelease == 'false' && steps.version.outputs.previous_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.tag }}
          previous_tag: ${{ steps.version.outputs.previous_tag }}
          generate_release_notes: true
          draft: true
          files: letta.js
          fail_on_unmatched_files: true

      - name: Create draft GitHub Release (no previous tag)
        if: steps.detect.outputs.should_publish == 'true' && steps.version.outputs.is_prerelease == 'false' && steps.version.outputs.previous_tag == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: true
          files: letta.js
          fail_on_unmatched_files: true

      # Build every signed daemon artifact against the immutable release tag
      # while the GitHub release is still a draft. The public latest pointer is
      # advanced only after the full matrix and upload complete successfully.
      - name: Build and attach Letta Daemon release
        if: steps.detect.outputs.should_publish == 'true' && steps.version.outputs.is_prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.AMELIA_GITHUB_TOKEN }}
          TARGET_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          RUN_NAME="Publish Letta Daemon $TARGET_TAG"
          BEFORE_RUN_ID=$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow daemon-release.yml \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // 0'
          )
          jq -n --arg tag "$TARGET_TAG" '{
            event_type: "publish_letta_daemon",
            client_payload: { tag: $tag }
          }' | gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input -

          RUN_ID=""
          for _ in {1..60}; do
            RUN_ID=$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow daemon-release.yml \
                --event repository_dispatch \
                --limit 20 \
                --json databaseId,displayTitle \
                | jq -r --arg name "$RUN_NAME" --argjson before "$BEFORE_RUN_ID" '
                    [.[] | select(.displayTitle == $name and .databaseId > $before)]
                    | max_by(.databaseId)
                    | .databaseId // empty
                  '
            )
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Publish complete GitHub Release
        if: steps.detect.outputs.should_publish == 'true' && steps.version.outputs.is_prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_COMMIT=$(
            git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$TARGET_TAG^{}" \
              | awk 'NR == 1 { print $1 }'
          )
          if [ -z "$TAG_COMMIT" ]; then
            TAG_COMMIT=$(
              git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$TARGET_TAG" \
                | awk 'NR == 1 { print $1 }'
            )
          fi
          test "$TAG_COMMIT" = "$GITHUB_SHA"
          cat > /tmp/expected-daemon-assets <<'EOF'
          SHA256SUMS
          latest-arm64-linux-arm64.yml
          latest-arm64-mac.yml
          latest-linux.yml
          latest-mac.yml
          latest.yml
          letta-daemon-linux-arm64.AppImage
          letta-daemon-linux-x86_64.AppImage
          letta-daemon-mac-arm64.dmg
          letta-daemon-mac-arm64.dmg.blockmap
          letta-daemon-mac-arm64.zip
          letta-daemon-mac-arm64.zip.blockmap
          letta-daemon-mac-x64.dmg
          letta-daemon-mac-x64.dmg.blockmap
          letta-daemon-mac-x64.zip
          letta-daemon-mac-x64.zip.blockmap
          letta-daemon-win-x64.exe
          letta-daemon-win-x64.exe.blockmap
          EOF
          gh release view "$TARGET_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name | select(startswith("letta-daemon-") or . == "SHA256SUMS" or (startswith("latest") and endswith(".yml")))' \
            | sort > /tmp/actual-daemon-assets
          diff -u /tmp/expected-daemon-assets /tmp/actual-daemon-assets
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TARGET_TAG" --jq '.id')
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest=true >/dev/null

      # Propagate the release downstream: dispatch the packaging bump
      # workflow with the exact version so bundled copies of the CLI never
      # silently lag behind published releases. Non-blocking: a failed
      # dispatch must not fail the release (a scheduled fallback run on the
      # receiving side picks up missed versions).
      - name: Dispatch downstream CLI bump
        if: steps.detect.outputs.should_publish == 'true' && steps.version.outputs.is_prerelease == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AMELIA_GITHUB_TOKEN }}
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Brief wait so the npm registry has propagated the new version
          # before the bump workflow tries to resolve it into lockfiles.
          sleep 60
          gh workflow run bump-code-desktop-letta-code.yml \
            --repo letta-ai/letta-cloud \
            -f letta_code_version="$TARGET_VERSION"

      # A workflow-created release does not emit another Actions run when it
      # uses GITHUB_TOKEN, so dispatch the separate cascade workflow directly.
      # Once dispatched, downstream failures stay on the cascade run and cannot
      # invalidate the already-published Letta Code release.
      - name: Dispatch dependent package release cascade
        if: steps.detect.outputs.should_publish == 'true' && steps.version.outputs.is_prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.AMELIA_GITHUB_TOKEN }}
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh workflow run release-cascade.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f letta_code_version="$TARGET_VERSION"

  build-pypi-wheels:
    needs: publish
    if: >-
      needs.publish.outputs.should_publish == 'true' &&
      needs.publish.outputs.is_prerelease == 'false' &&
      needs.publish.outputs.pypi_published != 'true'
    uses: ./.github/workflows/pypi-wheels.yml

  publish-pypi:
    needs: [publish, build-pypi-wheels]
    if: >-
      always() &&
      needs.publish.result == 'success' &&
      needs.build-pypi-wheels.result == 'success' &&
      needs.publish.outputs.should_publish == 'true' &&
      needs.publish.outputs.is_prerelease == 'false' &&
      needs.publish.outputs.pypi_published != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/project/letta/
    permissions:
      id-token: write
    steps:
      - name: Download tested wheels
        uses: actions/download-artifact@v5
        with:
          pattern: letta-wheel-*
          path: dist
          merge-multiple: true

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
