name: Built-in Skills Agent Watch

on:
  schedule:
    - cron: "47 */8 * * *"
  workflow_dispatch:
    inputs:
      skill:
        description: "Exact bundled skill ID to audit instead of rotating"
        required: false
        type: string
      dry_run:
        description: "Build the candidate without writing tracker state or invoking Amelia"
        required: false
        default: false
        type: boolean

concurrency:
  group: builtin-skills-agent-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Select built-in skill audit
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SKILL: ${{ inputs.skill }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--analysis-file "$RUNNER_TEMP/builtin-skills-watch-analysis.json")
          if [ -n "$REQUESTED_SKILL" ]; then
            ARGS+=(--skill "$REQUESTED_SKILL")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          bun scripts/builtin-skills-watch/agent-watch.ts "${ARGS[@]}"

      - name: Upload dry-run analysis
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v6
        with:
          name: builtin-skills-watch-${{ github.run_id }}
          path: ${{ runner.temp }}/builtin-skills-watch-analysis.json
          retention-days: 3

      - name: Resolve Amelia GitHub identity
        if: steps.detect.outputs.should_run_agent == 'true'
        id: github-identity
        env:
          GH_TOKEN: ${{ secrets.AMELIA_GITHUB_TOKEN }}
        run: |
          login=$(gh api user --jq .login)
          echo "login=$login" >> "$GITHUB_OUTPUT"
          echo "Authenticated GitHub login: $login"

      - name: Build Amelia prompt
        if: steps.detect.outputs.should_run_agent == 'true'
        id: prompt
        env:
          TRACKER_ISSUE: ${{ steps.detect.outputs.tracker_issue }}
          TRACKER_ISSUE_URL: ${{ steps.detect.outputs.tracker_issue_url }}
          SKILL: ${{ steps.detect.outputs.skill }}
          CANDIDATE_ID: ${{ steps.detect.outputs.candidate_id }}
          CURRENT_SHA: ${{ steps.detect.outputs.current_sha }}
          SKILL_DIGEST: ${{ steps.detect.outputs.skill_digest }}
          AUDIT_AT: ${{ steps.detect.outputs.audit_at }}
          EXPECTED_GITHUB_LOGIN: ${{ steps.github-identity.outputs.login }}
        run: |
          {
            echo "prompt<<AMELIA_PROMPT_EOF"
            cat .github/agent-prompts/builtin-skills-agent-watch.md
            echo
            echo "## Run inputs"
            echo
            echo "- Tracker issue: #$TRACKER_ISSUE ($TRACKER_ISSUE_URL)"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Expected GitHub login: $EXPECTED_GITHUB_LOGIN"
            echo "- Selected skill: $SKILL"
            echo "- Candidate ID: $CANDIDATE_ID"
            echo "- Current commit: $CURRENT_SHA"
            echo "- Skill digest: $SKILL_DIGEST"
            echo "- Audit timestamp: $AUDIT_AT"
            echo
            echo "## Sandbox bootstrap"
            echo
            echo "Run this exact block before reviewing the skill:"
            echo
            echo '```bash'
            echo 'set -euo pipefail'
            echo 'rm -rf /tmp/letta-code-builtin-skills-watch'
            # The token expands later in Amelia's sandbox.
            # shellcheck disable=SC2016
            echo 'test -n "$AMELIA_GITHUB_TOKEN" && GITHUB_TOKEN= GH_TOKEN="$AMELIA_GITHUB_TOKEN" gh repo clone letta-ai/letta-code /tmp/letta-code-builtin-skills-watch -- --no-checkout'
            echo 'cd /tmp/letta-code-builtin-skills-watch'
            echo "env -u AMELIA_GITHUB_TOKEN -u GH_TOKEN -u GITHUB_TOKEN git checkout \"$CURRENT_SHA\""
            echo 'env -u AMELIA_GITHUB_TOKEN -u GH_TOKEN -u GITHUB_TOKEN bun install --frozen-lockfile'
            echo "env -u AMELIA_GITHUB_TOKEN -u GH_TOKEN -u GITHUB_TOKEN GITHUB_SERVER_URL=https://github.com GITHUB_REPOSITORY=letta-ai/letta-code GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" bun scripts/builtin-skills-watch/agent-watch.ts --dry-run --skill \"$SKILL\" --current-sha \"$CURRENT_SHA\" --audit-at \"$AUDIT_AT\" --analysis-file /tmp/builtin-skills-watch-analysis.json > /tmp/builtin-skills-watch-analysis.log"
            echo "jq -e '.candidate_id == \"$CANDIDATE_ID\" and .skill == \"$SKILL\" and .current_sha == \"$CURRENT_SHA\" and .skill_digest == \"$SKILL_DIGEST\"' /tmp/builtin-skills-watch-analysis.json > /dev/null"
            echo '```'
            echo "AMELIA_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "conversation_name=$GITHUB_WORKFLOW $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Ask Amelia to audit built-in skill
        if: steps.detect.outputs.should_run_agent == 'true'
        id: review
        uses: letta-ai/letta-code-action@4b8e508a523ff576fee09be1432d6f39158c272c
        with:
          letta_api_key: ${{ secrets.AMELIA_LETTA_API_KEY }}
          github_token: ${{ secrets.AMELIA_GITHUB_TOKEN }}
          agent_id: agent-cd664b86-4d28-49b7-8ad6-60677eaff9be
          environment: cloud
          letta_args: --new
          track_progress: ""
          tracking_comment: "false"
          model: auto
          prompt: ${{ steps.prompt.outputs.prompt }}

      - name: Name watcher conversation
        if: always() && steps.review.outputs.conversation_id != ''
        continue-on-error: true
        env:
          LETTA_API_KEY: ${{ secrets.AMELIA_LETTA_API_KEY }}
          CONVERSATION_ID: ${{ steps.review.outputs.conversation_id }}
          CONVERSATION_NAME: ${{ steps.prompt.outputs.conversation_name }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $LETTA_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$(jq -nc --arg summary "$CONVERSATION_NAME" '{summary: $summary}')" \
            --output /dev/null \
            "https://api.letta.com/v1/conversations/$CONVERSATION_ID"

      - name: Record Amelia result
        if: always() && steps.detect.outputs.should_run_agent == 'true' && steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.AMELIA_GITHUB_TOKEN }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          EXPECTED_GITHUB_LOGIN: ${{ steps.github-identity.outputs.login }}
        run: |
          result=$(jq -r '[.[] | select(.type == "result" and (.result | type) == "string")] | last | (.result // "" | split("\n") | map(gsub("^\\s+|\\s+$"; "") | select(length > 0)) | last // "")' "$EXECUTION_FILE")
          if [ "${#result}" -gt 8192 ] || [[ ! "$result" =~ ^SKILL_WATCH_RESULT\ [A-Za-z0-9+/=]+$ ]]; then
            echo "Unexpected Amelia result format" >&2
            exit 1
          fi
          printf '%s' "${result#SKILL_WATCH_RESULT }" | base64 --decode > "$RUNNER_TEMP/builtin-skill-watch-result.json"
          bun scripts/builtin-skills-watch/update-tracker.ts \
            --tracker-issue "${{ steps.detect.outputs.tracker_issue }}" \
            --analysis-file "$RUNNER_TEMP/builtin-skills-watch-analysis.json" \
            --result-file "$RUNNER_TEMP/builtin-skill-watch-result.json" \
            --expected-github-login "$EXPECTED_GITHUB_LOGIN"

      - name: Verify terminal outcome
        if: steps.detect.outputs.should_run_agent == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/builtin-skills-watch/update-tracker.ts \
            --tracker-issue "${{ steps.detect.outputs.tracker_issue }}" \
            --candidate-id "${{ steps.detect.outputs.candidate_id }}" \
            --assert-terminal

      - name: Record failed review attempt
        if: failure() && steps.detect.outputs.should_run_agent == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if bun scripts/builtin-skills-watch/update-tracker.ts \
            --tracker-issue "${{ steps.detect.outputs.tracker_issue }}" \
            --candidate-id "${{ steps.detect.outputs.candidate_id }}" \
            --assert-terminal; then
            echo "The agent recorded a terminal outcome before its action failed"
            exit 0
          fi
          bun scripts/builtin-skills-watch/update-tracker.ts \
            --tracker-issue "${{ steps.detect.outputs.tracker_issue }}" \
            --analysis-file "$RUNNER_TEMP/builtin-skills-watch-analysis.json" \
            --outcome error \
            --notes "Amelia review failed before recording a terminal outcome; retry this skill"
