name: Letta Daemon

on:
  pull_request:
    paths:
      - apps/daemon/**
      - src/cli/subcommands/host-protocol.ts
      - src/cli/subcommands/host-protocol.test.ts
      - src/cli/subcommands/listen.tsx
      - src/cli/subcommands/listen-usage.ts
      - src/cli/subcommands/server.ts
      - src/cli/subcommands/server.test.ts
      - package.json
      - bun.lock
      - .github/workflows/daemon.yml
      - .github/workflows/daemon-release.yml
      - .github/workflows/release.yml
  push:
    branches:
      - main
    paths:
      - apps/daemon/**
      - src/cli/subcommands/host-protocol.ts
      - src/cli/subcommands/host-protocol.test.ts
      - src/cli/subcommands/listen.tsx
      - src/cli/subcommands/listen-usage.ts
      - src/cli/subcommands/server.ts
      - src/cli/subcommands/server.test.ts
      - package.json
      - bun.lock
      - .github/workflows/daemon.yml
      - .github/workflows/daemon-release.yml
      - .github/workflows/release.yml

concurrency:
  group: daemon-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          - name: macOS arm64
            runner: macos-14
          - name: macOS x64
            runner: macos-15-intel
          - name: Windows x64
            runner: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Check daemon and listener protocol
        run: |
          bun run daemon:check
          bun test src/cli/subcommands/host-protocol.test.ts src/cli/subcommands/server.test.ts

      - name: Build Letta Code and daemon
        run: |
          bun run build
          bun run daemon:build

      - name: Package unpacked application
        run: bun run --cwd apps/daemon package:dir

      - name: Verify packaged runtime
        run: |
          node - <<'NODE'
          const { existsSync, readdirSync, statSync } = require('node:fs');
          const { join } = require('node:path');
          function find(root, suffix) {
            if (!existsSync(root)) return null;
            for (const entry of readdirSync(root)) {
              const path = join(root, entry);
              if (statSync(path).isDirectory()) {
                const nested = find(path, suffix);
                if (nested) return nested;
              } else if (path.replaceAll('\\', '/').endsWith(suffix)) return path;
            }
            return null;
          }
          const release = 'apps/daemon/release';
          const asar = find(release, '/resources/app.asar');
          const cli = find(release, '/resources/runtime/letta.js');
          if (!asar || !cli) throw new Error(`Missing packaged files: asar=${asar}, cli=${cli}`);
          console.log({ asar, cli });
          NODE
          ASAR=$(find apps/daemon/release -path '*/resources/app.asar' -print -quit)
          bunx asar list "$ASAR" > /tmp/daemon-asar-files.txt
          for path in \
            /dist/main.cjs \
            /dist/preload.cjs \
            /assets/tray-connected.png \
            /assets/tray-error.png \
            /assets/tray-stopped.png \
            /assets/tray-working.png; do
            grep -Fxq "$path" /tmp/daemon-asar-files.txt
          done
